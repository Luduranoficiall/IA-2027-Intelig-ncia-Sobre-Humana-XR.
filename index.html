<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>IA 2027: Inteligência Sobre-Humana XR</title>
    <meta name="description" content="Ambiente espacial WebXR do cenário AI 2027: telemetria de mega-clusters em tempo real, modelos 3D de biossegurança, feedback háptico e inteligência estratégica com Google Gemini." />
    <meta property="og:title" content="IA 2027: Inteligência Sobre-Humana XR" />
    <meta property="og:description" content="Ambiente espacial WebXR do cenário AI 2027: telemetria de mega-clusters em tempo real, modelos 3D de biossegurança, feedback háptico e inteligência estratégica com Google Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden select-none">
    <!-- 2D HUD Quick-Bar (Desktop Preview & Spatial Companion) -->
    <header class="hud-bar" id="hudOverlay">
      <div class="hud-badge">
        <span class="pulse-dot"></span>
        <span>OPENBRAIN SCI-4</span>
      </div>
      <button id="btnOpenOnboarding2D" class="hud-btn hud-btn-guide" title="Abrir Guia Interativo de Navegação e Telemetria WebXR">
        <svg style="width: 16px; height: 16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Guia Interativo</span>
      </button>
      <button id="btnToggleZen2D" class="hud-btn hud-btn-zen" title="Liberar visão dos modelos 3D afastando painéis espaciais">
        <svg style="width: 16px; height: 16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <span>Palco 3D Limpo</span>
      </button>
      <button id="btnToggleAudio2D" class="hud-btn hud-btn-audio" title="Ativar ou mutar o Áudio Espacial 3D (Zumbido de Data Center e Ressonância Neural)">
        <svg id="audioIcon2D" style="width: 16px; height: 16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <span id="audioLabel2D">Áudio 3D: ON</span>
      </button>
      <button id="btnExportDossier2D" class="hud-btn hud-btn-dossier" title="Abrir Prévia do Dossiê Executivo de Crise (4 Páginas) e Baixar PDF">
        <svg style="width: 16px; height: 16px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <span>Prévia do Dossiê (PDF)</span>
      </button>
    </header>

    <!-- Toast Notification for Export Results -->
    <div id="dossierToast" class="hud-toast hidden">
      <svg style="width: 20px; height: 20px; color: #34d399;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="dossierToastMsg">Dossiê Executivo gerado com sucesso!</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
